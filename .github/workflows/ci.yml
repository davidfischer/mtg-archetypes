name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Run Ruff Lint
        run: uv run ruff check .
      - name: Run Ruff Format Check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run Pytest
        run: uv run pytest

  validate-archetypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Cache Scryfall Card Catalog
        uses: actions/cache@v4
        with:
          path: .cache/scryfall_catalog.json
          key: scryfall-catalog-${{ github.run_id }}
          restore-keys: |
            scryfall-catalog-
      - name: Validate YAML Archetypes & Card Names
        run: uv run python scripts/validate_archetypes.py --check-cards
